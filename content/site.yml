# Copy that speaks for the owner: the one-line openers, the name, the facts.
#
# Not interface vocabulary. Navigation labels and section headings are the
# interface's own words, they are English in both locales by an earlier
# decision, and they stay in the components.
#
# Read at build time, not from the database. It stays in git so a change has a
# diff and can be reverted, and it stays in the HTML so a crawler that does not
# run JavaScript and a link preview card can both see it.

name: Kunhua Huang
subtitle: MSCS @Northeastern University

# One opener per page. Four things are possible:
#
#   about: one line              same in both languages, which is a decision
#   about: {zh: …, en: …}        they differ; both have to be there
#   about: |                     a block keeps the line breaks you write
#     first line
#     second line
#   (key removed)                that page has no opening line
#
# Leaving a key with nothing after it fails the build. That is the case where
# somebody meant to write something, and a page with a silent gap where its
# opening line should be looks exactly like a page that never had one.
openers:
  # Written in English to begin with: it is what the first email sent from
  # China said, in 1987. It reads the same on both sides.
  about: Across the Great Wall we can reach every corner in the world

  posts:
    zh: 你的我的
    # TODO(kunhua): 英文版。这两句是你的话，我不代写。
    # 在填之前英文页显示中文，跟以前一样。
    en: 你的我的
  projects:
    zh: 这里那里
    # TODO(kunhua): 同上。
    en: 这里那里

copyright: © 2026 Kunhua Huang

github: https://github.com/ecstasoy

# The one open-source entry on the homepage. It says what the project is
# rather than what was contributed; the link lands on the merged pull requests.
open_source:
  name: RIME
  note: an open-source input method engine
  url: https://github.com/pulls?q=is%3Apr+author%3Aecstasoy+is%3Amerged+org%3Arime

name: web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'content/**'
      - 'deploy/release.sh'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'content/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/ci_key <<< "$DEPLOY_KEY"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/ci_key"
          # Dg+ws keeps setgid on every directory, so anything created inside
          # inherits the shared group. Without the s, rsync's own mode setting
          # clears the bit it inherited and subdirectories fall back to the
          # creator's primary group — which is what broke retention.
          rsync -az --delete --chmod=Dg+ws,Fg+w -e "$SSH" web/out/ "ci@$HOST:/srv/kunhua.sh/releases/$SHA/"
          scp -i ~/.ssh/ci_key deploy/release.sh "ci@$HOST:/srv/kunhua.sh/release.sh"
          $SSH "ci@$HOST" "bash /srv/kunhua.sh/release.sh $SHA"
